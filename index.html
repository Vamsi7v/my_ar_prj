<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
}
</style>
</head>

<body>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    missTolerance: 10;
    warmupTolerance: 5;
    filterMinCF: 0.0001;
    filterBeta: 0.001;
  "
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <video
      id="ar-video"
      src="https://res.cloudinary.com/drv486zqa/video/upload/v1780136300/Flow_202604172319_hhxsgz.mp4"
      preload="auto"
      muted
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>

    <img
      id="top-img"
      src="./top.jpg"
      crossorigin="anonymous">

    <img
      id="bottom-img"
      src="./bottom.jpeg"
      crossorigin="anonymous">

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="content"
      scale="0.1 0.1 0.1">

      <!-- TOP IMAGE -->
      <a-image
        src="#top-img"
        width="1.5"
        height="1.8"
        position="0 2.1 0">
      </a-image>

      <!-- VIDEO -->
      <a-video
        id="videoPlane"
        src="#ar-video"
        width="2"
        height="1.125"
        position="0 0 0">
      </a-video>

      <!-- BOTTOM IMAGE -->
      <a-image
        src="#bottom-img"
        width="1.0"
        height="1.5"
        position="0 -2.1 0">
      </a-image>

    </a-entity>

  </a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const target = document.getElementById("target");
  const content = document.getElementById("content");
  const video = document.getElementById("ar-video");

  let started = false;

  target.addEventListener("targetFound", async () => {

    if (!started) {

      started = true;

      content.setAttribute(
        "animation",
        "property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 1500; easing: easeOutElastic"
      );

      content.setAttribute(
        "animation__float",
        "property: position; to: 0 0.08 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine"
      );

      try {
        video.currentTime = 0;
        await video.play();
      } catch(e) {
        console.log(e);
      }
    }
  });

  // Don't pause when targetLost
  target.addEventListener("targetLost", () => {
    console.log("Tracking lost temporarily");
  });

});
</script>

</body>
</html>
