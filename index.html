<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video
      id="ar-video"
      src="https://res.cloudinary.com/drv486zqa/video/upload/v1780136300/Flow_202604172319_hhxsgz.mp4"
      preload="auto"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video id="ar-plane" src="#ar-video" width="1.6" height="0.9" position="0 0 0"></a-video>
  </a-entity>
</a-scene>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const video  = document.getElementById("ar-video");
  const target = document.getElementById("target");
  const plane  = document.getElementById("ar-plane");
  const camera = document.querySelector("a-camera");

  let animating = false;

  target.addEventListener("targetFound", async () => {
    try {
      video.currentTime = 0;
      await video.play();
    } catch(e) {
      console.error(e);
    }

    if (animating) return;
    animating = true;

    function updateScale() {
      // Get camera world position
      const camPos = new THREE.Vector3();
      camera.object3D.getWorldPosition(camPos);

      // Get video plane world position
      const planePos = new THREE.Vector3();
      plane.object3D.getWorldPosition(planePos);

      const dist  = camPos.distanceTo(planePos);
      // Scale the plane itself, not the target
      // At dist=1 → scale=1, at dist=3 → scale=3
      const scale = Math.max(0.5, dist);
      plane.object3D.scale.set(scale, scale, scale);

      requestAnimationFrame(updateScale);
    }
    updateScale();
  });

  target.addEventListener("targetLost", () => {
    video.pause();
    animating = false;
  });
});
</script>
</body>
</html>
