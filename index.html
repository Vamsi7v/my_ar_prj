<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="ar-video"
      src="https://res.cloudinary.com/drv486zqa/video/upload/v1780136300/Flow_202604172319_hhxsgz.mp4"
      preload="auto"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
    <img id="top-img" src="./top.jpg" crossorigin="anonymous"/>
    <img id="bottom-img" src="./bottom.jpeg" crossorigin="anonymous"/>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">

    <!-- TOP IMAGE — portrait, above video with gap -->
    <a-image
      src="#top-img"
      width="1.6"
      height="2"
      position="0 2.3 0">
    </a-image>

    <!-- VIDEO in the middle -->
    <a-video
      id="ar-plane"
      src="#ar-video"
      width="1.6"
      height="0.9"
      position="0 0 0">
    </a-video>

    <!-- BOTTOM IMAGE — portrait, below video with gap -->
    <a-image
      src="#bottom-img"
      width="1.6"
      height="2"
      position="0 -2.3 0">
    </a-image>

  </a-entity>
</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const video  = document.getElementById("ar-video");
  const target = document.getElementById("target");

  target.addEventListener("targetFound", async () => {
    try {
      video.currentTime = 0;
      await video.play();
    } catch(e) {
      console.error(e);
    }
  });

  target.addEventListener("targetLost", () => {
    video.pause();
  });
});
</script>
</body>
</html>
