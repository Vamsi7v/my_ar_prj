<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video
      id="ar-video"
      src="https://res.cloudinary.com/drv486zqa/video/upload/v1780136300/Flow_202604172319_hhxsgz.mp4"
      preload="auto"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video id="ar-plane" src="#ar-video" width="1.6" height="0.9" position="0 0 0"></a-video>
  </a-entity>
</a-scene>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const video  = document.getElementById("ar-video");
  const target = document.getElementById("target");
  const plane  = document.getElementById("ar-plane");
  const camera = document.querySelector("a-camera");

  target.addEventListener("targetFound", async () => {
    try {
      video.currentTime = 0;
      await video.play();
    } catch(e) {
      console.error(e);
    }
  });

  target.addEventListener("targetLost", () => {
    video.pause();
  });

  // Run every frame
  const sceneEl = document.querySelector("a-scene");
  sceneEl.addEventListener("renderstart", () => {
    sceneEl.renderer.setAnimationLoop(() => {
      // MindAR stores distance to target in the camera Z after projection
      // We read the target's scale set by MindAR, then compensate
      const mindARScale = target.object3D.scale.x;
      if (mindARScale > 0) {
        // Inverse the MindAR scale and multiply by a fixed big size
        // so it stays constant size regardless of distance
        // Then add extra so it grows instead of shrinks
        const compensated = (1 / mindARScale) * 1.2;
        plane.object3D.scale.set(compensated, compensated, compensated);
      }
    });
  });
});
</script>
</body>
</html>
