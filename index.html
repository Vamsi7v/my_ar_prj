<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="ar-video"
      src="https://res.cloudinary.com/drv486zqa/video/upload/v1780136300/Flow_202604172319_hhxsgz.mp4"
      preload="auto"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera
    camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-video
      id="videoPlane"
      src="#ar-video"
      width="1.6"
      height="0.9"
      position="0 0 0">
    </a-video>

  </a-entity>

  <a-entity id="worldAnchor"></a-entity>

</a-scene>

<script>

AFRAME.registerComponent('grow-with-distance', {
  tick: function () {

    const camera = document.querySelector('[camera]');
    if (!camera) return;

    const camPos = camera.object3D.getWorldPosition(
      new THREE.Vector3()
    );

    const objPos = this.el.object3D.getWorldPosition(
      new THREE.Vector3()
    );

    const distance = camPos.distanceTo(objPos);

    let scale = distance * 1.5;

    scale = Math.max(1, scale);
    scale = Math.min(10, scale);

    this.el.object3D.scale.set(
      scale,
      scale,
      scale
    );
  }
});

document.addEventListener("DOMContentLoaded", () => {

  const target = document.getElementById("target");
  const videoPlane = document.getElementById("videoPlane");
  const worldAnchor = document.getElementById("worldAnchor");
  const video = document.getElementById("ar-video");

  let locked = false;

  target.addEventListener("targetFound", async () => {

    if (locked) return;

    locked = true;

    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();

    videoPlane.object3D.getWorldPosition(pos);
    videoPlane.object3D.getWorldQuaternion(quat);

    worldAnchor.object3D.position.copy(pos);
    worldAnchor.object3D.quaternion.copy(quat);

    videoPlane.parentNode.removeChild(videoPlane);

    worldAnchor.appendChild(videoPlane);

    videoPlane.setAttribute(
      "grow-with-distance",
      ""
    );

    try {
      video.currentTime = 0;
      await video.play();
    } catch (e) {
      console.error(e);
    }

    console.log("AR Locked");
  });

});
</script>

</body>
</html>
